<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Door Designer</title>
  <meta name="description" content="Design your custom door with our interactive configurator" />

  <!-- Preload critical fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Inline critical CSS so shell paints BEFORE JS loads -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    /* App shell - renders INSTANTLY before React loads */
    #app-shell {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    #app-shell .shell-sidebar {
      width: 380px;
      background: white;
      border-right: 1px solid #e2e8f0;
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    #app-shell .shell-header {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0 16px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }

    #app-shell .shell-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      position: relative;
    }

    /* Skeleton pulse animation */
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: 8px;
    }

    .skeleton-line {
      height: 14px;
      margin-bottom: 12px;
      border-radius: 4px;
    }

    .skeleton-block {
      height: 40px;
      margin-bottom: 12px;
      border-radius: 6px;
    }



    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }

    /* Hide shell once React mounts */
    #root:not(:empty)+#app-shell {
      display: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #app-shell {
        flex-direction: column;
      }

      #app-shell .shell-sidebar {
        width: 100%;
        height: auto;
        max-height: 50vh;
        border-right: none;
        border-bottom: 1px solid #e2e8f0;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-jKLtsBD_.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-4Dq4UY0q.css">
</head>

<body>
  <!-- React mount point -->
  <div id="root"></div>

  <!-- Static shell - visible INSTANTLY, hidden when React renders -->
  <div id="app-shell">
    <div class="shell-sidebar">
      <div class="shell-header">
        🚪 Custom Door Designer
      </div>
      <div class="skeleton skeleton-block" style="width: 100%;"></div>
      <div class="skeleton skeleton-line" style="width: 60%;"></div>
      <div class="skeleton skeleton-block" style="width: 100%;"></div>
      <div class="skeleton skeleton-line" style="width: 80%;"></div>
      <div class="skeleton skeleton-block" style="width: 100%;"></div>
      <div class="skeleton skeleton-line" style="width: 45%;"></div>
      <div class="skeleton skeleton-block" style="width: 100%;"></div>
      <div class="skeleton skeleton-block" style="width: 100%;"></div>
    </div>
    <div class="shell-main">
      <div style="text-align: center;">
        <div class="spinner"></div>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 8px;">Loading Door Designer...</p>
      </div>
    </div>
  </div>

</body>

</html>
